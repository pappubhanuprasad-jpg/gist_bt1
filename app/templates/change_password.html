{% extends "base_public.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card card-sms bg-white p-4 p-lg-5">
            <h4 class="fw-bold text-navy mb-1">Set New Password</h4>
            <p class="text-muted small mb-4">
                Logged in as <strong>{{ current_user.username }}</strong>. Please choose a new password (minimum 8 characters).
            </p>

            {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/change-password">
                <div class="mb-3">
                    <label for="new_password" class="form-label fw-medium">New Password</label>
                    <input type="password"
                           class="form-control"
                           id="new_password"
                           name="new_password"
                           minlength="8"
                           required
                           autofocus>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label fw-medium">Confirm New Password</label>
                    <input type="password"
                           class="form-control"
                           id="confirm_password"
                           name="confirm_password"
                           minlength="8"
                           required>
                </div>

                <button type="submit"
                        class="btn text-white w-100 py-2 fw-semibold"
                        style="background-color: #0B2150;">
                    Update Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
